name: Build and check docassemble package
description: Builds the package, checks syntax, and runs YAML validation

inputs:
  python-version:
    description: Python version to use
    default: "3.12"
  skip-url-check:
    description: Skip URL checker network calls
    default: "false"
  skip-templates:
    description: Skip checking URLs in template files
    default: "false"
  ignore-urls:
    description: Comma/newline-separated absolute URLs to ignore in URL checks
    default: ""
  docx-validation-mode:
    description: >-
      How to report accessibility problems in DOCX templates under
      docassemble/*/data/templates.
      'warning' annotates the job without failing it (default).
      'error' fails the build when a template has accessibility errors.
      'off' skips the check entirely.
    default: "warning"

runs:
  using: composite
  steps:
    - uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Set uv exclude-newer
      run: echo "UV_EXCLUDE_NEWER=7 days" >> $GITHUB_ENV
      shell: bash

    - name: Install dependencies
      run: uv tool install "dayamlchecker>=1.5.0" --exclude-newer-package "dayamlchecker=0 days"
      shell: bash

    - name: Check syntax for all files
      run: python -m compileall . -q
      shell: bash

    - name: Build a binary wheel and a source tarball
      run: uv build --sdist --wheel --out-dir dist/
      shell: bash

    - name: Run YAML and template document checker
      env:
        SKIP_URL_CHECK: ${{ inputs.skip-url-check }}
        SKIP_TEMPLATES: ${{ inputs.skip-templates }}
        IGNORE_URLS: ${{ inputs.ignore-urls }}
        DOCX_VALIDATION_MODE: ${{ inputs.docx-validation-mode }}
      run: |
        # necessary because dayamlchecker.check_questions_urls isn't a binary.
        source $(uv tool dir)/dayamlchecker/bin/activate

        args=()
        if [ "$SKIP_URL_CHECK" = "true" ]; then
          args+=(--no-url-check)
        fi

        if [ "$SKIP_TEMPLATES" = "true" ]; then
          args+=(--url-check-skip-templates)
        fi

        if [ -n "$IGNORE_URLS" ]; then
          args+=(--url-check-ignore-urls "$IGNORE_URLS")
        fi

        if [ "$DOCX_VALIDATION_MODE" = "off" ]; then
          args+=(--no-docx-accessibility)
        else
          # Default is "warning", which reports every finding without failing
          # the build so authors can work through them over time.
          args+=(--docx-accessibility-severity "$DOCX_VALIDATION_MODE")
        fi

        # Annotate the PR rather than only writing to the log.
        args+=(--format github)

        # Match specific files rather than whole directories: not every YAML
        # file is a docassemble interview (workflows, ALKiln fixtures), and
        # only documents under the package's own data/templates are the ones
        # users receive. Both patterns are anchored at the repo root, and
        # build/ and dist/ are pruned, because the `uv build` step above has
        # already copied the package into build/lib -- without this every
        # finding is reported twice and the annotations point at the copy
        # instead of the file the author edits.
        find . \
          \( -path ./build -o -path ./dist -o -path ./.venv \) -prune -o \
          \( \
            \( -name "*.yml" -path "./docassemble/*/questions/*" \) -o \
            \( -name "*.docx" -path "./docassemble/*/data/templates/*" \
               -not -name '~$*' \) \
          \) -print0 | xargs -0 python -m dayamlchecker "${args[@]}"
      shell: bash

    - name: Check URLs in question/template files
      env:
        SKIP_URL_CHECK: ${{ inputs.skip-url-check }}
        SKIP_TEMPLATES: ${{ inputs.skip-templates }}
        IGNORE_URLS: ${{ inputs.ignore-urls }}
      run: |
        # necessary because dayamlchecker.check_questions_urls isn't a binary.
        source $(uv tool dir)/dayamlchecker/bin/activate
        if [ "$SKIP_URL_CHECK" = "true" ]; then
          echo "Skipping URL checks"
          exit 0
        fi

        args=()
        if [ "$SKIP_TEMPLATES" = "true" ]; then
          args+=(--skip-templates)
        fi

        if [ -n "$IGNORE_URLS" ]; then
          args+=(--ignore-urls "$IGNORE_URLS")
        fi

        output_file="$(mktemp)"
        set +e
        python -m dayamlchecker.check_questions_urls "${args[@]}" 2>&1 | tee "$output_file"
        checker_status=${PIPESTATUS[0]}
        set -e

        if [ "$checker_status" -ne 0 ]; then
          exit "$checker_status"
        fi
        
        # Surface warning lines as a single GitHub Actions annotation without failing the job.
        in_warning_block=false
        warning_text=""
        while IFS= read -r line; do
          if [ "$line" = "URL checker warnings:" ]; then
            in_warning_block=true
            continue
          fi
          if [ "$in_warning_block" != "true" ]; then
            continue
          fi
          if [ -z "$line" ]; then
            continue
          fi
          if [ -n "$warning_text" ]; then
            warning_text+=$'\n'
          fi
          warning_text+="$line"
        done < "$output_file"

        if [ -n "$warning_text" ]; then
          escaped="${warning_text//'%'/'%25'}"
          escaped="${escaped//$'\r'/'%0D'}"
          escaped="${escaped//$'\n'/'%0A'}"
          echo "::warning title=URL checker::$escaped"
        fi
      shell: bash
